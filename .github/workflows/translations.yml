name: translate

on:
  workflow_dispatch:
  push:
    branches:
      - beta

jobs:
  auto-translate:
    runs-on: ubuntu-latest
    steps:
      - uses: Mips2648/plugins-translations@v2.0.1
        with:
          deepl_api_key: ${{ secrets.DEEPL_API_KEY }}
          use_core_translations: false